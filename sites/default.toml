# Calibration for one window. ROIs are fractions of the frame (x, y from the top-left,
# w, h as widths), so they keep working if the resolution changes.
#
# Measured on the live view of jf-pi-5 (v2 window mount), Nov 4 2026:
#   bridge: the bascule span from the left abutment to the right pier, deck to pier feet
#   boat:   the channel under and just right of the bridge, where boats pass through
# Fine-tune per Pi by overriding [site.rois.*] in /etc/wth/device.toml.

[site]
name = "default"
left_is = "WEST"
right_is = "EAST"

[site.rois.bridge]
x = 0.13
y = 0.57
w = 0.21
h = 0.15

[site.rois.boat]
x = 0.24
y = 0.66
w = 0.22
h = 0.15

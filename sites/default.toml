# Calibration for one window. ROIs are fractions of the frame (x, y from the top-left,
# w, h as widths), so they keep working if the resolution changes.
#
# These two were converted from the Pi 3 code's pixel ROIs at 1280x720:
#   boat:   700x100 box, offset +300,+200 from centre  (wth-edge-device boat detector)
#   bridge: 165x135 box, offset -105,+105 from centre  (wth-inference-training bridge.py)
# They match the old mount. Re-check them against the live view after mounting the v2 case.

[site]
name = "default"
left_is = "WEST"
right_is = "EAST"

[site.rois.boat]
x = 0.461
y = 0.708
w = 0.539
h = 0.139

[site.rois.bridge]
x = 0.353
y = 0.551
w = 0.129
h = 0.188

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "wth-edge"
version = "2.0.0.dev0"
description = "Watch The Hutch edge device: camera, detectors, round status screen and local web panel for a Raspberry Pi."
requires-python = ">=3.11"
# numpy and pillow come from apt on the Pi (python3-numpy, python3-pil) through
# --system-site-packages, so keep these lower bounds loose.
dependencies = [
    "numpy>=1.24",
    "pillow>=9.4",
    "psutil>=5.9",
    "fastapi>=0.100",
    "uvicorn>=0.22",
]

[project.optional-dependencies]
# On the Pi these come from apt: python3-picamera2, python3-spidev, python3-gpiozero, python3-lgpio.
pi = ["spidev", "gpiozero"]
# Replaying .mp4 files (camera.driver = "file" / run --source) and recording clips off the Pi.
replay = ["opencv-python-headless", "av>=11"]
dev = ["pytest", "httpx", "av>=11", "opencv-python-headless"]

[project.scripts]
wth-edge = "wth_edge.cli:main"

[tool.setuptools.packages.find]
include = ["wth_edge*"]

[tool.setuptools.package-data]
"wth_edge.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
